services:
  database:
    image: postgres:18-alpine
    ports:
      - '5438:5432'
    environment:
      POSTGRES_DB: ingenium_demo
      POSTGRES_USER: ingenium
      POSTGRES_PASSWORD: ingenium_local
    volumes:
      - ingenium_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ingenium -d ingenium_demo']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ingenium_pg:
